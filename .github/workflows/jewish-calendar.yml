name: Add Dynamic Jewish Calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jewish-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar directly into main app
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_calendar.py
          python /tmp/patch_calendar.py
      - name: Commit calendar update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gourmet-glatt-batch5.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Put full-year Jewish calendar in main layout"
            git push
          fi