name: Add Dynamic Jewish Calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jewish-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar directly into main app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          # Replace the September-only calendar data with a full-year Jewish calendar
          # calculated locally in the browser. No visual layout changes.
          s=re.sub(
            r"const HOL=\{.*?\};\nfunction renderMonth\(\)\{.*?\}\nfunction dateTap\(ds,ev\)\{.*?\}\nfunction renderCats",
            r'''function hebParts(dt){
 const parts=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'}).formatToParts(dt);
 const get=t=>parts.find(p=>p.type===t)?.value||'';
 return {day:Number(get('day')),month:get('month'),year:get('year')};
}
function hebShort(dt){return new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'short'}).format(dt)}
function yomTovName(dt){
 const h=hebParts(dt),m=h.month,n=h.day;
 if(m==='Tishri'||m==='Tishrei'){
  if(n===1||n===2)return 'Rosh Hashana';
  if(n===10)return 'Yom Kippur';
  if(n===15||n===16)return 'Sukkos';
  if(n===22)return 'Shemini Atzeres';
  if(n===23)return 'Simchas Torah';
 }
 if(m==='Nisan'&&(n===15||n===16||n===21||n===22))return 'Pesach';
 if(m==='Sivan'&&(n===6||n===7))return 'Shavuos';
 return '';
}
function jewishEvent(dt){
 const yt=yomTovName(dt);
 if(yt)return yt;
 if(dt.getDay()===6)return 'Shabbos Day';
 if(dt.getDay()===5)return 'Shabbos Night';
 return '';
}
function renderMonth(){let y=cal.getFullYear(),m=cal.getMonth();$('monthLabel').textContent=cal.toLocaleString(undefined,{month:'long',year:'numeric'});let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="dow">${d}</div>`);for(let i=0;i<42;i++){let n,dt,mut='';if(i<start){n=prev-start+i+1;dt=new Date(y,m-1,n);mut=' muted'}else if(i>=start+days){n=i-start-days+1;dt=new Date(y,m+1,n);mut=' muted'}else{n=i-start+1;dt=new Date(y,m,n)}let ds=isoLocal(dt),ev=jewishEvent(dt),cls=ev.includes('Shabbos')?' shabbos':ev?' holiday':'',s=suppers.find(x=>x.date===ds);cells+=`<button class="date${mut}${cls}" onclick="dateTap('${ds}','${ev.replaceAll("'","&#39;")}')"><span class="n">${n}</span><div style="font-size:9px;color:#748077;margin-top:2px">${hebShort(dt)}</div>${ev?`<div class="evt">${ev}</div>`:s?`<div class="evt" style="color:#0d7a43">${esc(s.name)}</div>`:''}</button>`}$('cal').innerHTML=cells}
function dateTap(ds,ev){if(ev){supMode=ev.toLowerCase().includes('shabbos')?'shab':'yt';nav('suppers');document.querySelectorAll('[data-sup]').forEach(b=>b.classList.toggle('on',b.dataset.sup===supMode));renderSuppers()}else openSupperPicker(ds)}
function renderCats''',
            s,
            count=1,
            flags=re.S
          )

          if 'function hebParts(dt)' not in s:
              raise SystemExit('Could not patch main calendar')
          p.write_text(s)

          # Disable the older calendar override in batch5 so the main calendar stays in control.
          b=Path('gourmet-glatt-batch5.js')
          t=b.read_text()
          marker='  // Full-year Jewish calendar.'
          if marker in t and '  // Calendar now lives directly in index.html.' not in t:
              t=t.replace(marker,"  // Calendar now lives directly in index.html.\n  if (typeof renderSuppers === 'function') renderSuppers();\n  return;\n\n"+marker,1)
              b.write_text(t)
          PY
      - name: Commit calendar update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gourmet-glatt-batch5.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Put full-year Jewish calendar in main layout"
            git push
          fi