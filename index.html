<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Shopping List</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8f6;color:#1f2a24}.app{max-width:720px;margin:auto;padding:16px 14px 88px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:25px}.badge{background:#e7f4eb;color:#0d7a43;border-radius:18px;padding:8px 12px;font-weight:800}.card{background:#fff;border:1px solid #e6eae6;border-radius:18px;padding:14px;margin:13px 0;box-shadow:0 2px 10px #00000008}.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}.hdr h2,.hdr h3{margin:0}.backCats{border:0;background:#edf1ee;color:#26352c;border-radius:11px;padding:8px 10px;font-weight:850;display:none;align-items:center;gap:5px}.backCats.show{display:inline-flex}.itemHdrLeft{display:flex;align-items:center;gap:8px;min-width:0}.itemHdrLeft h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;background:#edf1ee;color:#26352c}.green{background:#0d7a43;color:#fff}.danger{background:#fff0f0;color:#a93434}.tabs,.seg{display:flex;gap:7px}.seg{background:#edf0ed;border-radius:14px;padding:4px;margin:10px 0}.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-weight:800}.seg .on{background:#fff;box-shadow:0 1px 4px #0001}.screen{display:none}.screen.on{display:block}.week{display:flex;gap:8px;overflow-x:auto;padding:4px 1px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.day{flex:0 0 82px;height:84px;border:1px solid #dfe5df;border-radius:14px;background:#fff;padding:8px 5px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.day.has{background:#f5fbf7}.day b{font-size:14px}.day .plus{margin-top:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e6f3e9;color:#0d7a43;font-weight:900}.monthHdr{display:flex;justify-content:space-between;align-items:center}.monthHdr button{border:0;background:#e8efea;border-radius:50%;width:40px;height:40px;font-size:24px;color:#0b7b43}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:12px;text-align:center;color:#66756d;font-weight:800}.date{min-height:76px;border:1px solid #e0e6e1;border-radius:12px;background:#fff;padding:6px;font-size:13px}.date.muted{opacity:.4}.date.holiday{background:#f7f0f9}.date.shabbos{background:#f2f8f3}.date .n{font-weight:900}.date .evt{font-size:10px;margin-top:5px;color:#5c326e;font-weight:800;line-height:1.1}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.cat{border:1px solid #e0e6e1;background:#fff;border-radius:16px;padding:16px;text-align:left;font-weight:850;font-size:16px}.cat .ico{display:block;font-size:28px;margin-bottom:6px}.rows{margin-top:12px}.itemrow,.shoprow{display:flex;gap:10px;align-items:center;padding:11px 3px;border-bottom:1px solid #edf0ed}.pic{width:44px;height:44px;border-radius:12px;background:#edf2ee;display:grid;place-items:center;font-size:23px;overflow:hidden;flex:0 0 auto}.pic img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.grow b{display:block}.sub{font-size:12px;color:#748077}.pill{border:0;background:#e8f4eb;color:#0b7b43;border-radius:18px;padding:8px 11px;font-weight:850}.check{width:28px;height:28px;border-radius:50%;border:2px solid #cdd6cf;background:#fff}.check.on{background:#17a557;border-color:#17a557;color:white}.supTabs{display:flex;background:#edf1ee;border-radius:14px;padding:4px;gap:4px}.supTabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:850;color:#0d7a43}.supTabs .on{background:#fff;box-shadow:0 1px 5px #0001}.menuCard{background:#f7fbf8;border:1px solid #dce7df;border-radius:18px;padding:14px;margin:12px 0}.menuHdr{display:flex;justify-content:space-between;align-items:center;gap:8px}.menuHdr h3{font-size:23px;margin:0}.menuActions{display:flex;gap:7px}.menuRows{margin-top:8px}.menuRow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #dfe7e1}.menuRow:last-child{border-bottom:0}.menuRow b{font-weight:900}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e1e6e2;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.bottom button{border:0;background:transparent;border-radius:14px;padding:8px 2px;color:#67736c;font-weight:800}.bottom button.on{background:#e8f5eb;color:#0c7b42}.bottom .ico{font-size:20px;display:block}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet h3{margin:0 0 12px;font-size:24px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dfd9;border-radius:12px;font:inherit;margin:6px 0 10px;background:#fff}.qty{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}.qty button{width:40px;height:40px;border:0;border-radius:50%;font-size:22px}.rowBtns{display:flex;gap:8px}.rowBtns button{flex:1}.hidden{display:none!important}@media(max-width:430px){.app{padding-left:12px;padding-right:12px}.top h1{font-size:24px}.cal{gap:4px}.date{min-height:68px;padding:5px}.menuRow{grid-template-columns:105px 1fr}.cats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="top"><h1 id="title">Shopping List</h1><div class="badge" id="count">0 items</div></div>
<section id="home" class="screen on"><div class="card"><div class="hdr"><h2>This Week</h2><button class="btn green" id="addSupperHome">+ Add Supper</button></div><div class="week" id="week"></div></div><div class="card"><div class="monthHdr"><button id="prev">‹</button><h2 id="monthLabel"></h2><button id="next">›</button></div><div class="cal" id="cal"></div></div></section>
<section id="items" class="screen"><div class="card"><div class="hdr"><div class="itemHdrLeft"><button id="backCats" class="backCats" type="button">‹ Categories</button><h2 id="itemTitle">Items</h2></div><button class="btn green" id="addItemBtn">+ Add Item</button></div><input id="search" placeholder="Search items"><div id="cats" class="cats"></div><div id="itemRows" class="rows" style="display:none"></div></div></section>
<section id="shopping" class="screen"><div class="card"><div class="hdr"><h2>Shopping</h2><button class="btn green" id="customBtn">+ Add Item</button></div><div class="seg"><button class="on" id="buyTab">To Buy</button><button id="selTab">Selected</button></div><div id="shopRows"></div></div></section>
<section id="suppers" class="screen"><div class="hdr" style="margin:12px 2px"><h2>Suppers</h2><button class="btn green" id="addSupperBtn">+ Add Supper</button></div><div class="supTabs"><button data-sup="mine" class="on">My Suppers</button><button data-sup="shab">Shabbos</button><button data-sup="yt">Yom Tov</button></div><div id="supContent"></div></section></div>
<div class="bottom"><button data-nav="home" class="on"><span class="ico">🏠</span>Home</button><button data-nav="items"><span class="ico">🛒</span>Items</button><button data-nav="shopping"><span class="ico">✅</span>Shopping</button><button data-nav="suppers"><span class="ico">🍽️</span>Suppers</button></div>
<div id="itemModal" class="modal"><div class="sheet"><h3>Add Item</h3><input id="newName" placeholder="Item name"><select id="newCat"></select><div class="qty"><button id="qminus">−</button><b id="qval">1</b><button id="qplus">+</button></div><input id="photoInput" type="file" accept="image/*" capture="environment"><img id="photoPrev" style="display:none;width:100%;max-height:180px;object-fit:cover;border-radius:12px"><div class="rowBtns"><button class="btn" onclick="closeModal('itemModal')">Cancel</button><button class="btn green" id="saveItem">Add</button></div></div></div>
<div id="menuModal" class="modal"><div class="sheet"><h3 id="menuModalTitle">Edit Menu</h3><div id="menuFields"></div><div class="rowBtns"><button class="btn" onclick="closeModal('menuModal')">Cancel</button><button class="btn green" id="saveMenu">Save</button></div></div></div>
<div id="supperModal" class="modal"><div class="sheet"><h3>Add Supper</h3><input id="supperName" placeholder="Supper name"><input id="supperDate" type="date"><textarea id="supperNotes" placeholder="Notes (optional)"></textarea><div class="rowBtns"><button class="btn" onclick="closeModal('supperModal')">Cancel</button><button class="btn green" id="saveSupper">Save Supper</button></div></div></div>
<script>
const $=id=>document.getElementById(id),N=s=>(s||'').trim().toLowerCase(),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const CAT=[['Produce','🥬'],['Dairy','🥛'],['Meat','🥩'],['Frozen','🧊'],['Pantry','🥫'],['Bakery','🥖'],['Snacks','🍿'],['Cereal','🥣'],['Drinks','🥤'],['Household','🧻'],['Shabbos','🕯️'],['Yom Tov','🍷']];
let items=load('itemsV4',[['Bananas','Produce','🍌'],['Apples','Produce','🍎'],['Milk','Dairy','🥛'],['Eggs','Dairy','🥚'],['Chicken','Meat','🍗'],['Ground Beef','Meat','🥩'],['French Fries','Frozen','🍟'],['Pasta','Pantry','🍝'],['Rice','Pantry','🍚'],['Bread','Bakery','🍞'],['Chips','Snacks','🍟'],['Pretzels','Snacks','🥨'],['Cheerios','Cereal','🥣'],['Corn Flakes','Cereal','🥣'],['Water','Drinks','💧'],['Soda','Drinks','🥤']]);
let custom=load('customV2',[]);custom.forEach(x=>{if(!items.find(i=>N(i[0])===N(x[0])))items.push(x)});let shop=load('shopV6',{}),suppers=load('suppersV3',[]),cal=new Date(),selectedCat=null,q=1,photoData='',supMode='mine',editCtx=null;
const H=load('menusV3',{shab:{night:{Appetizers:['Salmon'],Starters:['Soup','Kugel'],Main:['Schnitzel & Mashed Potatoes','Oyster Steak','Rib Steak'],Sides:['Cucumber Salad','Pastrami Rice'],Desserts:['Dessert']},day:{Appetizers:['Eggs','Liver'],Starters:['Kugel'],Main:['Cholent','Meat'],Sides:['String Beans','Salad'],Desserts:['Dessert']}},yt:{night:{Appetizers:['Salmon'],Starters:['Soup','Kugel'],Main:['Schnitzel & Mashed Potatoes','Meat'],Sides:['Salad','Rice'],Desserts:['Dessert']},day:{Appetizers:['Eggs'],Starters:['Kugel'],Main:['Cholent','Meat'],Sides:['Salad'],Desserts:['Dessert']}}});
function persist(){save('shopV6',shop);save('itemsV4',items);save('suppersV3',suppers);save('menusV3',H)}
function closeModal(id){$(id).classList.remove('on')}
function nav(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav===id));$('title').textContent=id==='home'?'Shopping List':id[0].toUpperCase()+id.slice(1);if(id==='items')renderCats();if(id==='shopping')renderShop('buy');if(id==='suppers')renderSuppers()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
function renderWeek(){let out='',d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()+i);let ds=x.toISOString().slice(0,10),s=suppers.find(y=>y.date===ds);out+=`<button class="day ${s?'has':''}" onclick="openSupper('${ds}')"><b>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</b>${s?`<span style="font-size:11px;margin-top:8px">${esc(s.name)}</span>`:`<span class="plus">+</span>`}</button>`}$('week').innerHTML=out}
const HOL={'2026-09-04':'Shabbos Night','2026-09-05':'Shabbos Day','2026-09-11':'Erev Rosh Hashana','2026-09-12':'Rosh Hashana','2026-09-13':'Rosh Hashana','2026-09-18':'Shabbos Night','2026-09-19':'Shabbos Day','2026-09-20':'Erev Yom Kippur','2026-09-21':'Yom Kippur','2026-09-25':'Shabbos Night','2026-09-26':'Shabbos Day'};
function renderMonth(){let y=cal.getFullYear(),m=cal.getMonth();$('monthLabel').textContent=cal.toLocaleString(undefined,{month:'long',year:'numeric'});let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="dow">${d}</div>`);for(let i=0;i<42;i++){let n,dt,mut='';if(i<start){n=prev-start+i+1;dt=new Date(y,m-1,n);mut=' muted'}else if(i>=start+days){n=i-start-days+1;dt=new Date(y,m+1,n);mut=' muted'}else{n=i-start+1;dt=new Date(y,m,n)}let ds=dt.toISOString().slice(0,10),ev=HOL[ds]||'',cls=ev.includes('Shabbos')?' shabbos':ev?' holiday':'';cells+=`<button class="date${mut}${cls}" onclick="dateTap('${ds}','${ev.replaceAll("'","&#39;")}')"><span class="n">${n}</span>${ev?`<div class="evt">${ev}</div>`:''}</button>`}$('cal').innerHTML=cells}
function dateTap(ds,ev){if(ev){supMode=ev.toLowerCase().includes('shabbos')?'shab':'yt';nav('suppers');document.querySelectorAll('[data-sup]').forEach(b=>b.classList.toggle('on',b.dataset.sup===supMode));renderSuppers()}else openSupper(ds)}
function renderCats(){let term=N($('search').value);if(selectedCat&&!term){$('backCats').classList.add('show');$('itemTitle').textContent=selectedCat;$('cats').style.display='none';$('itemRows').style.display='block';renderItemRows(items.filter(i=>i[1]===selectedCat));return}$('backCats').classList.remove('show');$('itemTitle').textContent='Items';$('cats').style.display='grid';$('itemRows').style.display='none';let data=CAT.filter(c=>!term||N(c[0]).includes(term)||items.some(i=>i[1]===c[0]&&N(i[0]).includes(term)));$('cats').innerHTML=data.map(c=>`<button class="cat" onclick="openCat('${c[0]}')"><span class="ico">${c[1]}</span>${c[0]}</button>`).join('');if(term){$('cats').style.display='none';$('itemRows').style.display='block';renderItemRows(items.filter(i=>N(i[0]).includes(term)||N(i[1]).includes(term)))}}
function openCat(c){selectedCat=c;$('search').value='';renderCats()}
function renderItemRows(arr){$('itemRows').innerHTML=arr.map(i=>`<div class="itemrow"><div class="pic">${i[3]?`<img src="${i[3]}">`:i[2]}</div><div class="grow"><b>${esc(i[0])}</b><span class="sub">${i[1]}</span></div><button class="pill" onclick="addShop('${js(i[0])}')">+ Add</button></div>`).join('')||'<div class="sub" style="padding:14px">No items found</div>'}
function addShop(name,qty=1){const i=items.find(x=>N(x[0])===N(name))||[name,'Pantry','🛒'];shop[N(name)]={name:i[0],cat:i[1],photo:i[2],customPhoto:i[3]||'',qty:(shop[N(name)]?.qty||0)+qty,selected:false};persist();updateCount();renderShop('buy')}
function updateCount(){$('count').textContent=`${Object.values(shop).filter(x=>!x.selected).length} items`}
function renderShop(mode){$('buyTab').classList.toggle('on',mode==='buy');$('selTab').classList.toggle('on',mode==='sel');let arr=Object.values(shop).filter(x=>!!x.selected===(mode==='sel'));$('shopRows').innerHTML=arr.map(x=>`<div class="shoprow"><button class="check ${x.selected?'on':''}" onclick="toggleShop('${js(x.name)}')">${x.selected?'✓':''}</button><div class="pic">${x.customPhoto?`<img src="${x.customPhoto}">`:x.photo}</div><div class="grow"><b>${esc(x.name)}</b><span class="sub">Qty ${x.qty}</span></div><button class="btn" onclick="delShop('${js(x.name)}')">×</button></div>`).join('')||'<div class="sub" style="padding:14px">Nothing here yet</div>';updateCount()}
function toggleShop(n){let x=shop[N(n)];if(x)x.selected=!x.selected;persist();renderShop(x&&x.selected?'buy':'sel')}
function delShop(n){delete shop[N(n)];persist();renderShop('buy')}
function openItemModal(){$('newName').value='';$('newCat').innerHTML=CAT.map(c=>`<option>${c[0]}</option>`).join('');$('qval').textContent=q=1;photoData='';$('photoPrev').style.display='none';$('itemModal').classList.add('on')}
async function resize(f){return new Promise(r=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,480/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};img.src=URL.createObjectURL(f)})}
function renderSuppers(){document.querySelectorAll('[data-sup]').forEach(b=>b.classList.toggle('on',b.dataset.sup===supMode));if(supMode==='mine'){$('supContent').innerHTML=`<div class="card"><h3 style="margin-top:0">My Suppers</h3>${suppers.length?suppers.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>`<div class="itemrow"><div class="grow"><b>${esc(s.name)}</b><span class="sub">${s.date?esc(s.date):'Saved supper'}${s.notes?' · '+esc(s.notes):''}</span></div><button class="btn danger" onclick="removeSupper('${s.id}')">Remove</button></div>`).join(''):'<div class="sub">No suppers added yet.</div>'}</div>`;return}let type=supMode==='shab'?'Shabbos':'Yom Tov',k=supMode;$('supContent').innerHTML=`<div style="margin:16px 3px 6px;font-weight:850;color:#748077">${type} Menu</div>${menuCard(k,'night','Night')}${menuCard(k,'day','Day')}`}
function menuCard(k,meal,label){let rows=Object.entries(H[k][meal]).map(([a,v])=>`<div class="menuRow"><b>${a}</b><span>${esc(v.join(', '))}</span></div>`).join('');return `<div class="menuCard"><div class="menuHdr"><h3>${label}</h3><div class="menuActions"><button class="btn green" onclick="addMenuItem('${k}','${meal}')">+ Item</button><button class="btn" onclick="editMenu('${k}','${meal}')">Edit</button></div></div><div class="menuRows">${rows}</div></div>`}
function editMenu(k,meal){editCtx={k,meal};$('menuModalTitle').textContent=`Edit ${meal==='night'?'Night':'Day'} Menu`;$('menuFields').innerHTML=Object.entries(H[k][meal]).map(([a,v])=>`<label style="font-weight:850">${a}</label><input data-menu-field="${a}" value="${attr(v.join(', '))}">`).join('');$('menuModal').classList.add('on')}
function addMenuItem(k,meal){let section=prompt('Section: Appetizers, Starters, Main, Sides, or Desserts');if(!section)return;let key=Object.keys(H[k][meal]).find(x=>N(x)===N(section));if(!key){alert('Please choose Appetizers, Starters, Main, Sides, or Desserts.');return}let item=prompt('Item to add');if(!item)return;H[k][meal][key].push(item.trim());persist();renderSuppers()}
function openSupper(date=''){$('supperDate').value=date;$('supperName').value='';$('supperNotes').value='';$('supperModal').classList.add('on')}
function removeSupper(id){suppers=suppers.filter(x=>x.id!==id);persist();renderWeek();renderSuppers()}
document.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{supMode=b.dataset.sup;renderSuppers()});
$('saveMenu').onclick=()=>{if(!editCtx)return;document.querySelectorAll('[data-menu-field]').forEach(i=>H[editCtx.k][editCtx.meal][i.dataset.menuField]=i.value.split(',').map(x=>x.trim()).filter(Boolean));persist();closeModal('menuModal');renderSuppers()};
$('saveSupper').onclick=()=>{let name=$('supperName').value.trim(),date=$('supperDate').value;if(!name)return;suppers.push({id:Date.now().toString(),name,date:date||'',notes:$('supperNotes').value.trim()});persist();closeModal('supperModal');renderWeek();renderSuppers()};
$('addSupperBtn').onclick=$('addSupperHome').onclick=()=>openSupper();
$('prev').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);renderMonth()};$('next').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);renderMonth()};$('search').oninput=renderCats;$('backCats').onclick=()=>{selectedCat=null;$('search').value='';renderCats()};$('addItemBtn').onclick=openItemModal;$('customBtn').onclick=openItemModal;$('buyTab').onclick=()=>renderShop('buy');$('selTab').onclick=()=>renderShop('sel');$('qminus').onclick=()=>{$('qval').textContent=q=Math.max(1,q-1)};$('qplus').onclick=()=>{$('qval').textContent=++q};$('photoInput').onchange=async e=>{const f=e.target.files[0];if(f){photoData=await resize(f);$('photoPrev').src=photoData;$('photoPrev').style.display='block'}};$('saveItem').onclick=()=>{const n=$('newName').value.trim(),c=$('newCat').value;if(!n)return;let i=items.find(x=>N(x[0])===N(n));if(!i){i=[n,c,'🛒',photoData];items.push(i);custom.push(i);save('customV2',custom)}else if(photoData){i[3]=photoData}addShop(n,q);closeModal('itemModal');nav('shopping');renderShop('buy')};document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
renderWeek();renderMonth();renderCats();renderShop('buy');renderSuppers();updateCount();
</script></body></html>
