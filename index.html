<style>
*{box-sizing:border-box}

.app{max-width:720px;margin:auto;padding:16px 14px 88px}

.hdr h2,.hdr h3{margin:0}

.screen{display:none}

.monthHdr{display:flex;justify-content:space-between;align-items:center}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:12px;text-align:center;color:#66756d;font-weight:800}
.date{min-height:76px;border:1px solid #e0e6e1;border-radius:12px;background:#fff;padding:6px;font-size:13px}
.date.muted{opacity:.4}
.date.holiday{background:#f7f0f9}
.date.shabbos{background:#f2f8f3}
.date .n{font-weight:900}

.cat .ico{display:block;font-size:28px;margin-bottom:6px}
.rows{margin-top:12px}
.itemrow,.shoprow{display:flex;gap:10px;align-items:center;padding:11px 3px;border-bottom:1px solid #edf0ed}

.grow{flex:1;min-width:0}
.grow b{display:block}
.sub{font-size:12px;color:#748077}
.pill{border:0;background:#e8f4eb;color:#0b7b43;border-radius:18px;padding:8px 11px;font-weight:850}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #cdd6cf;background:#fff}
.check.on{background:#17a557;border-color:#17a557;color:white}
.supTabs{display:flex;background:#edf1ee;border-radius:14px;padding:4px;gap:4px}
.supTabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:850;color:#0d7a43}
.supTabs .on{background:#fff;box-shadow:0 1px 5px #0001}
.menuCard{background:#f7fbf8;border:1px solid #dce7df;border-radius:18px;padding:14px;margin:12px 0}
.menuHdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menuHdr h3{font-size:23px;margin:0}
.menuActions{display:flex;gap:7px}
.menuRows{margin-top:8px}
.menuRow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #dfe7e1}
.menuRow:last-child{border-bottom:0}
.menuRow b{font-weight:900}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e1e6e2;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.bottom button{border:0;background:transparent;border-radius:14px;padding:8px 2px;color:#67736c;font-weight:800}
.bottom button.on{background:#e8f5eb;color:#0c7b42}
.bottom .ico{font-size:20px;display:block}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:50}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:24px}

.rowBtns button{flex:1}
.hidden{display:none!important}
.round{border:0;background:#edf1ee;border-radius:50%;width:38px;height:38px;font-size:22px}
.listbtn{width:100%;position:relative;text-align:left;padding:16px 44px 16px 16px;border:1px solid #e0e6e1;background:#fff;border-radius:16px;min-height:58px;font-weight:850;margin:7px 0}
.listbtn:after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:25px;color:#7b867e}
.recipeHero{background:linear-gradient(145deg,#f7faf7,#edf6f0);border:1px solid #d8e5dc;border-radius:18px;padding:16px;margin-bottom:12px}
.recipeHero h3{margin:0;font-size:21px}
.recipeMeta{margin-top:4px;font-size:12px;color:#748078;font-weight:750}

.ingredientList{display:grid;gap:9px}

.recipeSteps{counter-reset:rstep;display:grid;gap:12px}
.recipeStep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;font-size:14px;line-height:1.45}
.recipeStep:before{counter-increment:rstep;content:counter(rstep);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e8f4ec;color:#0d7a43;font-size:12px;font-weight:900}
.recipeActions{display:grid;gap:8px;margin-top:13px}
.currentPick{background:#f5fbf7;border:1px solid #d8e5dc;border-radius:14px;padding:11px 12px;margin:0 0 10px;font-size:13px}

</style>
</head>

const $=id=>document.getElementById(id),N=s=>(s||'').trim().toLowerCase(),save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};

(window.GOURMET_GLATT_BATCH1||[]).forEach(x=>{if(!items.find(i=>N(i[0])===N(x[0])))items.push(x)});

function renderWeek(){let out='',d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());for(let i=0;i<7;i++){let x=new Date(d);x.setDate(d.getDate()+i);let ds=isoLocal(x),s=suppers.find(y=>y.date===ds);out+=`<button class="day ${s?'has':''}" onclick="openSupperPicker('${ds}')"><b>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</b>${s?`<span style="font-size:11px;margin-top:8px">${esc(s.name)}</span>`:`<span class="plus">+</span>`}</button>`}$('week').innerHTML=out}
const HOL={'2026-09-04':'Shabbos Night','2026-09-05':'Shabbos Day','2026-09-11':'Erev Rosh Hashana','2026-09-12':'Rosh Hashana','2026-09-13':'Rosh Hashana','2026-09-18':'Shabbos Night','2026-09-19':'Shabbos Day','2026-09-20':'Erev Yom Kippur','2026-09-21':'Yom Kippur','2026-09-25':'Shabbos Night','2026-09-26':'Shabbos Day'};
function renderMonth(){let y=cal.getFullYear(),m=cal.getMonth();$('monthLabel').textContent=cal.toLocaleString(undefined,{month:'long',year:'numeric'});let first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>cells+=`<div class="dow">${d}</div>`);for(let i=0;i<42;i++){let n,dt,mut='';if(i<start){n=prev-start+i+1;dt=new Date(y,m-1,n);mut=' muted'}else if(i>=start+days){n=i-start-days+1;dt=new Date(y,m+1,n);mut=' muted'}else{n=i-start+1;dt=new Date(y,m,n)}let ds=isoLocal(dt),ev=HOL[ds]||'',cls=ev.includes('Shabbos')?' shabbos':ev?' holiday':'',s=suppers.find(x=>x.date===ds);cells+=`<button class="date${mut}${cls}" onclick="dateTap('${ds}','${ev.replaceAll("'","&#39;")}')"><span class="n">${n}</span>${ev?`<div class="evt">${ev}</div>`:s?`<div class="evt" style="color:#0d7a43">${esc(s.name)}</div>`:''}</button>`}$('cal').innerHTML=cells}
function dateTap(ds,ev){if(ev){supMode=ev.toLowerCase().includes('shabbos')?'shab':'yt';nav('suppers');document.querySelectorAll('[data-sup]').forEach(b=>b.classList.toggle('on',b.dataset.sup===supMode));renderSuppers()}else openSupperPicker(ds)}
function renderCats(){let term=N($('search').value);if(selectedCat&&!term){$('backCats').classList.add('show');$('itemTitle').textContent=selectedCat;$('cats').style.display='none';$('itemRows').style.display='block';renderItemRows(items.filter(i=>i[1]===selectedCat));return}$('backCats').classList.remove('show');$('itemTitle').textContent='Items';$('cats').style.display='grid';$('itemRows').style.display='none';let data=CAT.filter(c=>!term||N(c[0]).includes(term)||items.some(i=>i[1]===c[0]&&N(i[0]).includes(term)));$('cats').innerHTML=data.map(c=>`<button class="cat" onclick="openCat('${c[0]}')"><span class="ico">${c[1]}</span>${c[0]}</button>`).join('');if(term){$('cats').style.display='none';$('itemRows').style.display='block';renderItemRows(items.filter(i=>N(i[0]).includes(term)||N(i[1]).includes(term)))}}
function openCat(c){selectedCat=c;$('search').value='';renderCats()}
function renderItemRows(arr){$('itemRows').innerHTML=arr.map(i=>`<div class="itemrow"><div class="pic">${i[3]?`<img src="${i[3]}">`:i[2]}</div><div class="grow"><b>${esc(i[0])}</b><span class="sub">${i[1]}</span></div><button class="pill" onclick="addShop('${js(i[0])}')">+ Add</button></div>`).join('')||'<div class="sub" style="padding:14px">No items found</div>'}
function addShop(name,qty=1){const i=items.find(x=>N(x[0])===N(name))||[name,'Pantry','🛒'];shop[N(name)]={name:i[0],cat:i[1],photo:i[2],customPhoto:i[3]||'',qty:(shop[N(name)]?.qty||0)+qty,selected:false};persist();updateCount();renderShop('buy')}
function addRecipeIngredients(name){const recipe=RECIPES[name];if(!recipe)return;recipe.ingredients.forEach(([n,cat,emoji])=>{let key=N(n),existing=shop[key];shop[key]={name:n,cat,photo:emoji,customPhoto:'',qty:(existing?.qty||0)+1,selected:false}});persist();updateCount();renderShop('buy');const btn=$('addRecipeBtn');if(btn){const old=btn.textContent;btn.textContent='✓ Added to Shopping List';btn.disabled=true;setTimeout(()=>{btn.textContent=old;btn.disabled=false},1200)}}
function updateCount(){$('count').textContent=`${Object.values(shop).filter(x=>!x.selected).length} items`}
function renderShop(mode){$('buyTab').classList.toggle('on',mode==='buy');$('selTab').classList.toggle('on',mode==='sel');let arr=Object.values(shop).filter(x=>!!x.selected===(mode==='sel'));$('shopRows').innerHTML=arr.map(x=>`<div class="shoprow"><button class="check ${x.selected?'on':''}" onclick="toggleShop('${js(x.name)}')">${x.selected?'✓':''}</button><div class="pic">${x.customPhoto?`<img src="${x.customPhoto}">`:x.photo}</div><div class="grow"><b>${esc(x.name)}</b><span class="sub">Qty ${x.qty}</span></div><button class="btn" onclick="delShop('${js(x.name)}')">×</button></div>`).join('')||'<div class="sub" style="padding:14px">Nothing here yet</div>';updateCount()}
function toggleShop(n){let x=shop[N(n)];if(x)x.selected=!x.selected;persist();renderShop(x&&x.selected?'buy':'sel')}
function delShop(n){delete shop[N(n)];persist();renderShop('buy')}
function openItemModal(){$('newName').value='';$('newCat').innerHTML=CAT.map(c=>`<option>${c[0]}</option>`).join('');$('qval').textContent=q=1;photoData='';$('photoPrev').style.display='none';$('itemModal').classList.add('on')}
async function resize(f){return new Promise(r=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,480/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};img.src=URL.createObjectURL(f)})}
function openRecipe(name){const recipe=RECIPES[name];if(!recipe){$('detailBody').innerHTML=`<div class="recipeHero"><h3>${esc(name)}</h3><div class="recipeMeta">Custom supper</div></div><div class="recipeSection"><h4>Recipe</h4><div class="sub">No recipe has been added for this supper yet.</div></div>`;$('detail').classList.add('on');return}$('detailBody').innerHTML=`<div class="recipeHero"><h3>${esc(name)}</h3><div class="recipeMeta">Supper • Ingredients & directions</div></div><div class="recipeSection"><h4>Ingredients</h4><div class="ingredientList">${recipe.ingredients.map(x=>`<div class="ingredientItem"><span class="ingredientDot"></span><span>${esc(x[0])}</span></div>`).join('')}</div></div><div class="recipeSection"><h4>Directions</h4><div class="recipeSteps">${recipe.steps.map(x=>`<div class="recipeStep"><span>${esc(x)}</span></div>`).join('')}</div></div><div class="recipeActions"><button id="addRecipeBtn" class="btn green" onclick="addRecipeIngredients('${js(name)}')">Add Ingredients to Shopping List</button><button class="btn" onclick="chooseDayForRecipe('${js(name)}')">Choose a Day</button></div>`;$('detail').classList.add('on')}
function chooseDayForRecipe(name){const d=prompt('Enter date as YYYY-MM-DD');if(!d)return;scheduleSupper(name,d);closeModal('detail')}
function openSupperPicker(date){pickDate=date||isoLocal(new Date());const current=suppers.find(x=>x.date===pickDate);$('pickTitle').textContent=`Choose Supper • ${new Date(pickDate+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;$('pickCurrent').innerHTML=current?`<div class="currentPick"><b>Currently:</b> ${esc(current.name)} <button class="btn danger" style="float:right;padding:6px 8px" onclick="removeSupperByDate('${pickDate}')">Remove</button></div>`:'';$('pickList').innerHTML=SUPPER_LIBRARY.map(name=>`<button class="listbtn" onclick="pickSupper('${js(name)}')">${esc(name)}</button>`).join('');$('picker').classList.add('on')}
function pickSupper(name){scheduleSupper(name,pickDate);closeModal('picker');openRecipe(name)}
function scheduleSupper(name,date){const existing=suppers.find(x=>x.date===date);if(existing){existing.name=name;existing.notes=existing.notes||''}else{suppers.push({id:Date.now().toString(),name,date,notes:''})}persist();renderWeek();renderMonth();if(supMode==='mine')renderSuppers()}
function removeSupperByDate(date){suppers=suppers.filter(x=>x.date!==date);persist();renderWeek();renderMonth();closeModal('picker')}
function renderSuppers(){document.querySelectorAll('[data-sup]').forEach(b=>b.classList.toggle('on',b.dataset.sup===supMode));if(supMode==='mine'){const library=SUPPER_LIBRARY.map(name=>`<button class="listbtn" onclick="openRecipe('${js(name)}')">${esc(name)}</button>`).join('');const scheduled=suppers.filter(s=>s.date).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>`<div class="itemrow"><div class="grow" onclick="openRecipe('${js(s.name)}')"><b>${esc(s.name)}</b><span class="sub">${esc(s.date)}${s.notes?' · '+esc(s.notes):''}</span></div><button class="btn danger" onclick="removeSupper('${s.id}')">Remove</button></div>`).join('');$('supContent').innerHTML=`<div class="card"><h3 style="margin-top:0">My Suppers</h3>${library}</div>${scheduled?`<div class="card"><h3 style="margin-top:0">Scheduled</h3>${scheduled}</div>`:''}`;return}let type=supMode==='shab'?'Shabbos':'Yom Tov',k=supMode;$('supContent').innerHTML=`<div style="margin:16px 3px 6px;font-weight:850;color:#748077">${type} Menu</div>${menuCard(k,'night','Night')}${menuCard(k,'day','Day')}`}
function menuCard(k,meal,label){let rows=Object.entries(H[k][meal]).map(([a,v])=>`<div class="menuRow"><b>${a}</b><span>${esc(v.join(', '))}</span></div>`).join('');return `<div class="menuCard"><div class="menuHdr"><h3>${label}</h3><div class="menuActions"><button class="btn green" onclick="addMenuItem('${k}','${meal}')">+ Item</button><button class="btn" onclick="editMenu('${k}','${meal}')">Edit</button></div></div><div class="menuRows">${rows}</div></div>`}
function editMenu(k,meal){editCtx={k,meal};$('menuModalTitle').textContent=`Edit ${meal==='night'?'Night':'Day'} Menu`;$('menuFields').innerHTML=Object.entries(H[k][meal]).map(([a,v])=>`<label style="font-weight:850">${a}</label><input data-menu-field="${a}" value="${attr(v.join(', '))}">`).join('');$('menuModal').classList.add('on')}
function addMenuItem(k,meal){let section=prompt('Section: Appetizers, Starters, Main, Sides, or Desserts');if(!section)return;let key=Object.keys(H[k][meal]).find(x=>N(x)===N(section));if(!key){alert('Please choose Appetizers, Starters, Main, Sides, or Desserts.');return}let item=prompt('Item to add');if(!item)return;H[k][meal][key].push(item.trim());persist();renderSuppers()}
function openSupper(date=''){$('supperDate').value=date;$('supperName').value='';$('supperNotes').value='';$('supperModal').classList.add('on')}
function removeSupper(id){suppers=suppers.filter(x=>x.id!==id);persist();renderWeek();renderMonth();renderSuppers()}
document.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{supMode=b.dataset.sup;renderSuppers()});
$('saveMenu').onclick=()=>{if(!editCtx)return;document.querySelectorAll('[data-menu-field]').forEach(i=>H[editCtx.k][editCtx.meal][i.dataset.menuField]=i.value.split(',').map(x=>x.trim()).filter(Boolean));persist();closeModal('menuModal');renderSuppers()};
$('saveSupper').onclick=()=>{let name=$('supperName').value.trim(),date=$('supperDate').value;if(!name)return;if(date){scheduleSupper(name,date)}else{suppers.push({id:Date.now().toString(),name,date:'',notes:$('supperNotes').value.trim()});persist();renderSuppers()}closeModal('supperModal');if(RECIPES[name])openRecipe(name)};
$('addSupperBtn').onclick=()=>openSupper();
$('addSupperHome').onclick=()=>openSupperPicker(isoLocal(new Date()));
$('prev').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);renderMonth()};$('next').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);renderMonth()};$('search').oninput=renderCats;$('backCats').onclick=()=>{selectedCat=null;$('search').value='';renderCats()};$('addItemBtn').onclick=openItemModal;$('customBtn').onclick=openItemModal;$('buyTab').onclick=()=>renderShop('buy');$('selTab').onclick=()=>renderShop('sel');$('qminus').onclick=()=>{$('qval').textContent=q=Math.max(1,q-1)};$('qplus').onclick=()=>{$('qval').textContent=++q};$('photoInput').onchange=async e=>{const f=e.target.files[0];if(f){photoData=await resize(f);$('photoPrev').src=photoData;$('photoPrev').style.display='block'}};$('saveItem').onclick=()=>{const n=$('newName').value.trim(),c=$('newCat').value;if(!n)return;let i=items.find(x=>N(x[0])===N(n));if(!i){i=[n,c,'🛒',photoData];items.push(i);custom.push(i);save('customV2',custom)}else if(photoData){i[3]=photoData}addShop(n,q);closeModal('itemModal');nav('shopping');renderShop('buy')};document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
renderWeek();renderMonth();renderCats();renderShop('buy');renderSuppers();updateCount();
</script>
</body>
</html>
