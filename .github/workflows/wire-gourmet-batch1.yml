name: Wire Gourmet Glatt Batch 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-gourmet-batch1.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="gourmet-glatt-batch1.js"></script>\n'
          if tag not in s:
              s=s.replace('<script>\nconst $=id=>', tag+'<script>\nconst $=id=>', 1)
          marker="let items=load('itemsV4',"
          if 'GOURMET_GLATT_BATCH1||[]' not in s:
              pos=s.find(marker)
              if pos<0:
                  raise SystemExit('items loader not found')
              end=s.find('\n',pos)
              if end<0:
                  raise SystemExit('items loader line end not found')
              merge="\n(window.GOURMET_GLATT_BATCH1||[]).forEach(x=>{if(!items.find(i=>N(i[0])===N(x[0])))items.push(x)});"
              s=s[:end]+merge+s[end:]
          p.write_text(s)
          PY
      - name: Commit only the index change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Connect Gourmet Glatt Produce and Dairy to Items"
            git push
          fi